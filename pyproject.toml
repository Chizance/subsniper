[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsniper"
version = "1.0.0"
description = "Fast Frontline Absence Management job poller with push alerts and filtered auto-accept"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
subsniper = "subsniper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
